[project]
name = "ai-act-assistant"
version = "0.1.0"
description = "Question-answering over the EU AI Act with retrieval-augmented generation and source citations."
readme = "README.md"
authors = [
    { name = "Loic Rouaud", email = "loic.rouaud@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ai-act-assistant = "ai_act_assistant:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = [
    "I",   # isort: import ordering
    "B",   # flake8-bugbear: likely bugs and design problems
    "UP",  # pyupgrade: modern Python syntax for the target version
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"